name = "what-im-doing-hub"
main = "worker.js"
compatibility_date = "2024-09-01"
workers_dev = true

# Custom Domain Route:
routes = [
	{ pattern = "api.mango-mesa.ccwu.cc", custom_domain = true }
]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "what-im-doing-fleet"
database_id = "39004996-6aa8-47dd-a013-e1d6b477520d"

# Optional Standalone Security:
# If not using Cloudflare Zero Trust Access for /admin, set a secret via:
#   npx wrangler secret put ADMIN_KEY
# Or declare plain-text for dev:
# [vars]
# ADMIN_KEY = "dev_secret_key"

# Observability
[observability]
enabled = true

